<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone 14 Pro | iPhoneShop</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            color: #f5f5f7;
            line-height: 1.5;
            min-height: 100vh;
        }
        header {
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .back {
            color: #0071e3;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
        }
        .logo {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }
        .logo span {
            background: linear-gradient(135deg, #0071e3, #00c6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 24px 20px 50px;
        }
        .gallery {
            margin-bottom: 24px;
        }
        .gallery .main-photo {
            height: 300px;
            background: #161616;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 14px;
        }
        .gallery .main-photo img {
            cursor: zoom-in;
            transition: opacity 0.2s ease;
        }
        .gallery .main-photo img:hover {
            opacity: 0.9;
        }
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 24px;
            cursor: zoom-out;
        }
        .lightbox.open {
            display: flex;
        }
        .lightbox img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 12px;
            object-fit: contain;
        }
        .lightbox-close {
            position: fixed;
            top: 18px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            font-size: 20px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .lightbox-close:hover {
            background: rgba(255,255,255,0.2);
        }
        .product-info {
            background: #161616;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            padding: 28px;
        }
        .model {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #fff;
        }
        .details {
            font-size: 15px;
            color: #8e8e93;
            margin-bottom: 16px;
        }
        .battery {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 20px;
            margin-bottom: 20px;
        }
        .battery.high { background: rgba(52, 199, 89, 0.15); color: #30d158; }
        .battery.medium { background: rgba(255, 204, 0, 0.15); color: #ffd60a; }
        .battery.nuevo { background: rgba(0, 113, 227, 0.15); color: #0a84ff; }
        .prices { margin-bottom: 24px; }
        .price-consult {
            font-size: 20px;
            font-weight: 700;
            color: #0a84ff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .price-consult::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #0a84ff;
        }
        .description {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .description h3 {
            font-size: 15px;
            margin-bottom: 10px;
            color: #fff;
        }
        .description p {
            font-size: 14px;
            color: #a1a1a6;
            margin-bottom: 16px;
        }
        .specs {
            list-style: none;
        }
        .specs li {
            font-size: 14px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
        }
        .specs li span:last-child { color: #8e8e93; }
        .whatsapp-btn {
            display: block;
            background: #25D366;
            color: white;
            text-align: center;
            padding: 16px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            margin-top: 24px;
            transition: background 0.2s;
        }
        .whatsapp-btn:hover { background: #1fbe57; }
        footer {
            text-align: center;
            padding: 30px 20px;
            color: #555;
            font-size: 13px;
        }
    
        .store-logo {
            width: 46px;
            height: 46px;
            object-fit: cover;
            border-radius: 10px;
            display: block;
            flex-shrink: 0;
        }
    
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="back">← Volver</a>
        <a href="index.html" aria-label="iPhoneShop"><img src="logo-tienda.jpeg" alt="Logo de iPhoneShop" class="store-logo"></a>
    </header>
    <div class="container">
        <div class="gallery">
            <div class="main-photo"><img src="iphone14pro.jpeg" alt="iPhone 14 Pro 128 GB - Negro" style="width:100%;height:100%;object-fit:cover;border-radius:18px;" onclick="document.getElementById('lightbox').classList.add('open')"></div>
        </div>
        <div class="product-info">
            <div class="model">iPhone 14 Pro</div>
            <div class="details">128 GB • Negro</div>
            <div class="battery high">🔋 100% de batería</div>
            <div class="prices">
                <div class="price-consult">$800.000 ARS</div>
            </div>
            <div class="description">
                <h3>Descripción</h3>
                <p>iPhone 14 Pro en excelente estado, con batería al 100%.</p>
                <ul class="specs">
                    <li><span>Almacenamiento</span> <span>128 GB</span></li>
                    <li><span>Color</span> <span>Negro</span></li>
                    <li><span>Estado</span> <span>Usado - Excelente</span></li>
                    <li><span>Batería</span> <span>100%</span></li>
                    <li><span>Garantía</span> <span>30 días</span></li>
                </ul>
            </div>
            <a href="https://wa.me/5493704281082?text=Hola%2C%20me%20interesa%20el%20iPhone%2014%20Pro%20Negro%20128GB" class="whatsapp-btn">
                Consultar por WhatsApp
            </a>
        </div>
    </div>
    <footer>iPhoneShop</footer>

    <div class="lightbox" id="lightbox" onclick="this.classList.remove('open')">
        <button class="lightbox-close" aria-label="Cerrar" onclick="document.getElementById('lightbox').classList.remove('open')">✕</button>
        <img src="iphone14pro.jpeg" alt="iPhone 14 Pro 128 GB - Negro - foto completa">
    </div>
</body>
</html>
